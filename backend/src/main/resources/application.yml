spring:
  application:
    name: taskflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflowdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Pa**w0rd}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 30
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
  compression:
    enabled: true
  servlet:
    context-path: /

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-please-this-is-a-dev-only-secret-256-bits-minimum-required-by-hs256}
      access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:1209600000}
      issuer: taskflow

  seed:
    enabled: ${APP_SEED_ENABLED:true}
    users:
      - email: ${SEED_MANAGER_EMAIL:manager@taskflow.local}
        password: ${SEED_MANAGER_PASSWORD:Manager@123}
        full-name: ${SEED_MANAGER_NAME:Default Manager}
        role: MANAGER
      - email: ${SEED_EMPLOYEE_EMAIL:employee@taskflow.local}
        password: ${SEED_EMPLOYEE_PASSWORD:Employee@123}
        full-name: ${SEED_EMPLOYEE_NAME:Default Employee}
        role: EMPLOYEE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.kosign.taskflow: DEBUG
    org.hibernate.SQL: WARN
